<title>飞书桌面便签 · 前端原型</title>
<style>

  .closed-note-content span { color:#858478; font-size:11px; }
  .closed-note-content button { margin-top:5px; }
  .auth-empty { display:flex; flex-direction:column; align-items:center; }
  .auth-empty[hidden] { display:none; }
  .auth-mark { display:grid; place-items:center; width:34px; height:34px; margin-bottom:13px; border:1px solid #e5dec6; border-radius:10px; color:#71836a; background:#fffdf3; }
  .auth-mark svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .auth-title { margin:0; color:#454239; font-size:15px; font-weight:620; letter-spacing:0; line-height:1.45; }

  .auth-primary:hover { border-color:#5f755f; background:#5f755f; }

  .note-empty-hint { margin-top:8px; color:#a09f95; font-size:11px; }
  .empty-hint { margin-top:8px; color:#a09f95; font-size:11px; }
  .note.is-empty .more-menu .menu-item:not(#open-notebook),.note.is-empty .more-menu .menu-separator { display:none; }
  .dialog-backdrop { position:absolute; z-index:80; inset:0; display:none; place-items:center; background:#22251f45; }
  .dialog-backdrop.open { display:grid; }
  .dialog { width:min(390px,calc(100% - 40px)); padding:20px; border:1px solid #e4e4dc; border-radius:13px; background:#fafaf4; box-shadow:0 15px 45px #171a1640; transform:rotate(-.3deg); }
  .dialog h2 { margin:0 0 5px; color:#45483f; font-size:15px; font-weight:650; }

  .dialog input[type=url]:focus { border-color:#8a9c8d; box-shadow:0 0 0 2px #8a9c8d24; }
  .dialog-error { min-height:18px; margin-top:6px; color:#a35f4c; font-size:11px; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .dialog-button { padding:7px 12px; border:1px solid #d9ddd2; border-radius:7px; color:#596159; background:#f6f7f0; font:12px -apple-system,sans-serif; cursor:pointer; }
  .dialog-button.primary { border-color:#738d7d; color:#fff; background:#738d7d; }
  .notebook-list { display:grid; gap:6px; max-height:310px; overflow:auto; }
  .notebook-entry { display:flex; justify-content:space-between; align-items:center; padding:10px; border:1px solid #e2e4da; border-radius:8px; background:#fffef9; }
  .notebook-entry strong { display:block; color:#4b5149; font-size:12px; font-weight:600; }
  .notebook-entry small { display:block; max-width:220px; overflow:hidden; color:#99978b; font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
  .notebook-entry button { border:0; color:#718879; background:transparent; font:11px -apple-system,sans-serif; cursor:pointer; }
  .notebook-entry button:disabled { color:#a7a69b; cursor:default; }
  .notebook-entry-actions { display:flex; flex:none; align-items:center; gap:8px; margin-left:8px; }
  .note { position:absolute; left:112px; top:118px; width:310px; height:390px; min-width:270px; min-height:260px; display:flex; flex-direction:column; border-radius:11px; background:transparent; box-shadow:0 7px 17px #34382b24,0 1px 2px #34382b18; overflow:visible; transform:rotate(-1.2deg); transform-origin:center; isolation:isolate; --paper-opacity:1; --paper-image:none; --font-cn:"PingFang SC"; --font-en:-apple-system; }
  .note.pinned { box-shadow:0 10px 24px #34382b38,0 1px 2px #34382b18; }
  .note-secondary { pointer-events:none; box-shadow:0 6px 15px #34382b20,0 1px 2px #34382b16; }
  .note-secondary .date-switcher,.note-secondary .resize-handle,.note-secondary .progress { display:none!important; }
  .note:before { content:""; position:absolute; z-index:-1; inset:0; border-radius:inherit; background-color:var(--paper); background-image:var(--paper-image); background-position:center; background-size:cover; opacity:var(--paper-opacity); pointer-events:none; }
  /* 八个透明热区让四边和四角都可以拖拽缩放；静止时不影响便签外观。 */
  .resize-handle { position:absolute; z-index:10; touch-action:none; }
  .resize-handle.n,.resize-handle.s { left:10px; right:10px; height:7px; cursor:ns-resize; }
  .resize-handle.n { top:-3px; } .resize-handle.s { bottom:-3px; }
  .resize-handle.e,.resize-handle.w { top:10px; bottom:10px; width:7px; cursor:ew-resize; }
  .resize-handle.e { right:-3px; } .resize-handle.w { left:-3px; }
  .resize-handle.ne,.resize-handle.nw,.resize-handle.se,.resize-handle.sw { width:13px; height:13px; }
  .resize-handle.ne { top:-4px; right:-4px; cursor:nesw-resize; }
  .resize-handle.nw { top:-4px; left:-4px; cursor:nwse-resize; }
  .resize-handle.se { bottom:-4px; right:-4px; cursor:nwse-resize; }
  .resize-handle.sw { bottom:-4px; left:-4px; cursor:nesw-resize; }
  .note-head { padding:15px 17px 12px; background:transparent; border-bottom:1px solid #d9ded3; }
  .drag { display:flex; justify-content:center; margin:-5px 0 11px; }
  .drag i { width:28px; height:3px; border-radius:3px; background:#c3c9bd; }
  .title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .title { font-size:16px; font-weight:650; letter-spacing:.1px; }
  .actions { display:flex; gap:5px; color:#918a7c; position:relative; }

  .ellipsis-mark { display:flex; align-items:center; justify-content:center; gap:2px; width:12px; height:12px; }
  .ellipsis-mark i { display:block; width:2.5px; height:2.5px; border-radius:50%; background:currentColor; }
  .icon:hover { background:#dfe3d8; }
  .add-note-icon { color:#627b69; font-size:20px; line-height:1; }
  .more-menu,.personalize-panel { display:none; position:absolute; right:0; top:31px; z-index:30; padding:5px; border:1px solid #d9ded3; border-radius:8px; background:#fbfbf5; box-shadow:0 8px 22px #34382b25; transform:rotate(1.2deg); }
  .more-menu.open,.personalize-panel.open { display:block; }

  .menu-item { width:100%; display:flex; justify-content:space-between; align-items:center; border:0; border-radius:5px; padding:8px 9px; color:#45483f; background:transparent; text-align:left; font:inherit; font-size:12px; cursor:pointer; }
  .menu-item:hover { background:#eef0e4; }

  .personalize-close { border:0; background:transparent; color:#797d73; cursor:pointer; font-size:16px; }
  .setting { display:grid; gap:5px; margin:9px 0; }
  .setting-label { color:#777b70; }
  .setting select,.setting input[type="range"] { width:100%; }
  .select-wrap { position:relative; width:100%; }
  .select-wrap:after { content:""; position:absolute; right:10px; top:50%; width:6px; height:6px; border-right:1.4px solid #777b70; border-bottom:1.4px solid #777b70; transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .setting select { appearance:none; -webkit-appearance:none; width:100%; padding:6px 28px 6px 7px; border:1px solid #d9ded3; border-radius:5px; background:#fffef9; color:#45483f; font:inherit; font-size:11px; cursor:pointer; }
  .upload-button { display:block; padding:7px; border:1px dashed #b9bdae; border-radius:5px; text-align:center; cursor:pointer; color:#626a5e; }
  .upload-button:hover { background:#f1f2e9; }
  .file-input { display:none; }
  .subtitle { margin-top:4px; color:var(--muted); font-size:11px; }
  .progress { display:flex; align-items:center; gap:8px; margin-top:13px; color:#777064; font-size:11px; }
  .bar { height:3px; flex:1; border-radius:3px; background:#d8ddd2; overflow:hidden; }
  .bar span { display:block; height:100%; width:38%; border-radius:3px; background:#849a78; }
  .task-list { padding:7px 16px 0; overflow:auto; min-height:0; }
  .task { display:flex; align-items:flex-start; gap:10px; padding:11px 2px; border-bottom:1px solid #dce1d7; cursor:pointer; }
  .check { appearance:none; flex:0 0 16px; width:16px; height:16px; margin:2px 0 0; border:1.4px solid #9da99e; border-radius:50%; background:#f8f8f1; cursor:pointer; position:relative; }
  .check:checked { background:#849a78; border-color:#849a78; }
  .check:checked:after { content:""; position:absolute; left:50%; top:46%; width:4px; height:7px; border-right:1.5px solid white; border-bottom:1.5px solid white; transform:translate(-50%,-50%) rotate(45deg); }
  .task-text { flex:1; min-width:0; font-size:13px; line-height:1.45; }
  .task-text .cn-text { font-family:var(--font-cn),sans-serif; }
  .task-text .en-text { font-family:var(--font-en),sans-serif; }

  .priority { flex:0 0 auto; color:#6e8171; font-size:10px; padding-top:2px; }
  .priority.high { color:#9d705e; }
  .completed { margin:7px 16px 0; border-top:1px solid var(--line); flex:0 0 auto; }
  .completed summary { padding:12px 1px; list-style:none; display:flex; align-items:center; justify-content:space-between; color:#807868; font-size:11px; cursor:pointer; }
  .completed summary::-webkit-details-marker { display:none; }

  .link { border:0; padding:0; color:#647b68; background:none; font:inherit; cursor:pointer; }
  .toast { position:absolute; bottom:24px; right:25px; padding:9px 13px; border-radius:9px; color:#fff; background:#37342e; box-shadow:0 4px 18px #0003; opacity:0; transform:translateY(7px); transition:.2s; font-size:12px; }
  .toast.show { opacity:1; transform:translateY(0); }
  .date-switcher { display:flex; align-items:center; justify-content:center; margin:8px 0 0; }

  .date-switcher button:hover { background:#f5efd9; }

  .date-step { width:27px; font-size:20px!important; }

  #previous-day { border-radius:7px 0 0 7px; }
  #next-day { border-radius:0 7px 7px 0; }
  .date-today { min-width:56px; padding:0 10px; border-right:0!important; border-left:0!important; border-radius:0; font-size:11px!important; font-weight:550!important; }
  @media(max-width:700px) { .note { left:16px; top:65px; width:min(310px,calc(100% - 32px)); } }

<script>
  let timer;
  // 独立 HTML 仍用于原型预览；macOS 应用的绑定状态由原生宿主响应。
  const nativeHostAvailable=Boolean(window.webkit?.messageHandlers?.todoHost);
  const pendingNativeRequests=new Map();
  let pendingViewURL='';
  let bindingInspection=null;
  let nativeTodoItems=[];
  let nativeSnapshotStale=false;
  let nativeHasSnapshot=false;
  let nativeLoadError='';
  let activeNotePreferences={opacity:100,fontCN:'PingFang SC',fontEN:'-apple-system'};
  let opacitySaveTimer=null;
  const nativeMutationInFlight=new Set();
  window.__todoNativeReceive=response=>{
    const pending=pendingNativeRequests.get(response.requestId);
    if(!pending)return;
    pendingNativeRequests.delete(response.requestId);
    if(response.ok)pending.resolve(response.result||{});
    else pending.reject(Object.assign(new Error(response.error?.message||'桌面操作失败。'),{code:response.error?.code||'NATIVE_ERROR'}));
  };
  function nativeRequest(method,params={}){
    return new Promise((resolve,reject)=>{
      const requestId=window.crypto?.randomUUID?window.crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
      pendingNativeRequests.set(requestId,{resolve,reject});
      window.webkit.messageHandlers.todoHost.postMessage({protocolVersion:1,requestId,method,params});
    });
  }
  let authState='unconnected', authDisplayName='', authErrorMessage='';
  function renderAuthState(){
    const panel=document.getElementById('auth-empty');
    const title=document.getElementById('auth-title');
    const description=document.getElementById('auth-description');
    const account=document.getElementById('auth-account');
    const action=document.getElementById('auth-action');
    const note=document.getElementById('auth-note');
    const status=document.getElementById('auth-status');
    panel.classList.toggle('is-authorizing',authState==='authorizing');
    panel.classList.toggle('is-error',authState==='error');
    account.hidden=authState!=='connected';
    status.textContent='';
    action.disabled=authState==='authorizing';
    if(authState==='connected'){
      title.textContent='飞书账号已连接';
      description.textContent='绑定一个多维表格视图，把待办带到桌面。';
      account.textContent=`当前账号：${authDisplayName||'飞书用户'}`;
      action.textContent='绑定多维表格';
      note.textContent='任务保存在飞书多维表格中，勾选状态会写回原记录。';
    }else if(authState==='authorizing'){
      title.textContent='正在连接飞书';
      description.textContent='请在浏览器中的飞书页面完成授权，完成后会自动返回 Todo。';
      action.textContent='等待授权完成…';
      note.textContent='如果浏览器没有打开，请稍等片刻后再试。';
      status.textContent='正在等待飞书授权';
    }else if(authState==='error'){
      title.textContent='没有完成连接';
      description.textContent='飞书授权未完成。你可以重新发起授权，或检查浏览器中的授权结果。';
      action.textContent='重新连接飞书';
      note.textContent='授权成功后即可继续绑定多维表格。';
      status.textContent=authErrorMessage||'授权已取消或暂时无法完成。';
    }else{
      title.textContent='';
      description.textContent='授权后，选择一个多维表格视图贴到桌面。';
      action.textContent='连接飞书账号';
      note.textContent='Todo 会读取视图任务，并在你勾选时更新完成状态。';
    }
  }
  function startFeishuAuthorization(){
    if(authState==='authorizing')return;
    document.getElementById('more-menu').classList.remove('open');
    authState='authorizing';authErrorMessage='';renderAuthState();
    if(nativeHostAvailable){
      nativeRequest('auth.start').catch(error=>{authState='error';authErrorMessage=error.message;renderAuthState();});
      return;
    }
    // 独立 HTML 的预览模拟：展示完整的授权中与授权成功状态，不会调用真实飞书接口。
    window.setTimeout(()=>{authState='connected';authDisplayName='示例飞书账号';renderAuthState();toast('原型演示：飞书账号已连接');},1200);
  }
  window.__todoNativeEvent=message=>{
    const payload=message?.payload||{};
    if(message?.event==='auth.started'){authState='authorizing';renderAuthState();}
    if(message?.event==='auth.completed'){authState='connected';authDisplayName=payload.displayName||'飞书用户';authErrorMessage='';renderAuthState();restoreNativeNotebook().catch(error=>toast(error.message));}
    if(message?.event==='auth.failed'){authState='error';authErrorMessage=payload.message||'';renderAuthState();}
    if(message?.event==='auth.signedOut'){authState='unconnected';authDisplayName='';replaceNotebookItems([],null);nativeTodoItems=[];nativeHasSnapshot=false;nativeSnapshotStale=false;nativeLoadError='';document.getElementById('note').classList.add('is-empty','is-calendar');document.getElementById('empty-note-content').hidden=false;document.getElementById('auth-empty').hidden=false;document.getElementById('closed-note-content').hidden=true;renderAuthState();renderCalendar();}
  };
  document.getElementById('auth-action').addEventListener('click',()=>{
    if(authState==='connected')showBindDialog();
    else startFeishuAuthorization();
  });
  const localNotebook=[];
  let activeBindingId=null;
  let selectedDateKey=localDateKey(new Date());
  let calendarMonthDate=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  function updateDeleteAvailability(){const button=document.getElementById('delete-note-button');if(button)button.disabled=localNotebook.length<=1||!activeBindingId;}
  function replaceNotebookItems(items,activeID){localNotebook.splice(0,localNotebook.length,...(items||[]));activeBindingId=activeID||null;updateDeleteAvailability();}
  function resetFieldMapping(){bindingInspection=null;const panel=document.getElementById('field-mapping');panel.innerHTML='';panel.classList.remove('open');document.getElementById('bind-submit').textContent='读取视图字段';}
  function showBindDialog(){if(authState!=='connected'){startFeishuAuthorization();return;}document.getElementById('more-menu').classList.remove('open');document.getElementById('bind-error').textContent='';resetFieldMapping();document.getElementById('view-url').value=nativeHostAvailable?pendingViewURL:'';document.getElementById('bind-dialog').classList.add('open');setTimeout(()=>document.getElementById('view-url').focus(),30);}
  function renderFieldMapping(inspection){
    bindingInspection=inspection;
    const panel=document.getElementById('field-mapping');panel.innerHTML='';panel.classList.add('open');
    const fields=inspection.fields||[];
    const addSelect=(id,label,choices,placeholder)=>{
      const row=document.createElement('label');row.className='field-row';const caption=document.createElement('span');caption.textContent=label;
      const select=document.createElement('select');select.id=id;select.required=true;
      const empty=document.createElement('option');empty.value='';empty.textContent=placeholder;select.append(empty);
      choices.forEach(field=>{const option=document.createElement('option');option.value=field.id;option.textContent=field.name;select.append(option);});
      row.append(caption,select);panel.append(row);return select;
    };
    const textFields=fields.filter(field=>field.type===1),dateFields=fields.filter(field=>field.type===5),singleFields=fields.filter(field=>field.type===3);
    addSelect('map-task-field','任务内容',textFields,'选择文本字段');
    addSelect('map-date-field','所属日期',dateFields,'选择日期字段');
    addSelect('map-priority-field','优先级',singleFields,'选择单选字段');
    const doneSelect=addSelect('map-done-field','完成状态',singleFields,'选择单选字段');
    const optionRow=document.createElement('div');optionRow.className='field-row';const optionCaption=document.createElement('span');optionCaption.textContent='状态选项';
    const optionWrap=document.createElement('div');optionWrap.style.display='grid';optionWrap.style.gridTemplateColumns='1fr 1fr';optionWrap.style.gap='6px';
    const doneOption=document.createElement('select');doneOption.id='map-done-option';doneOption.required=true;const undoneOption=document.createElement('select');undoneOption.id='map-undone-option';undoneOption.required=true;
    optionWrap.append(doneOption,undoneOption);optionRow.append(optionCaption,optionWrap);panel.append(optionRow);
    const updateOptions=()=>{
      doneOption.innerHTML='';undoneOption.innerHTML='';
      const field=fields.find(item=>item.id===doneSelect.value);const options=field?.options||[];
      [[doneOption,'已完成'],[undoneOption,'未完成']].forEach(([select,name])=>{const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent=`选择${name}`;select.append(placeholder);options.filter(item=>item.name===name).forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name;select.append(option);});});
      if(options.some(item=>item.name==='已完成'))doneOption.value=options.find(item=>item.name==='已完成').id;
      if(options.some(item=>item.name==='未完成'))undoneOption.value=options.find(item=>item.name==='未完成').id;
    };
    doneSelect.addEventListener('change',updateOptions);updateOptions();
    const hint=document.createElement('div');hint.className='field-note';hint.textContent=`已读取视图“${inspection.viewName||'多维表格视图'}”的字段。请明确选择字段；任务顺序沿用飞书视图。`;panel.append(hint);
    document.getElementById('bind-submit').textContent='建立便签';
  }
  function renderNotebook(entries=localNotebook){
    const list=document.getElementById('notebook-list');list.innerHTML='';
    if(!entries.length){list.innerHTML='<div class="empty-hint">还没有便签，点击 + 绑定一个视图。</div>';return;}
    entries.forEach(entry=>{
      const row=document.createElement('div');row.className='notebook-entry';
      const info=document.createElement('div');const title=document.createElement('strong');title.textContent=entry.name;
      const url=document.createElement('small');url.textContent=entry.url;info.append(title,url);
      const actions=document.createElement('div');actions.className='notebook-entry-actions';
      const open=document.createElement('button');open.textContent=entry.id===activeBindingId?'当前便签':'打开';open.disabled=entry.id===activeBindingId;
      open.addEventListener('click',async()=>{
        if(nativeHostAvailable){open.disabled=true;open.textContent='正在验证…';try{
          const result=await nativeRequest('notebook.open',{bindingId:entry.id});
          replaceNotebookItems(entries,result.activeBindingId);nativeHasSnapshot=false;nativeTodoItems=[];nativeSnapshotStale=false;nativeLoadError='';
          showBoundNote();applyNotePreferences(result.preferences);applyNativeSnapshot(result.snapshot);document.getElementById('notebook-dialog').classList.remove('open');
        }catch(error){open.disabled=false;open.textContent='打开';toast(`打开失败，当前便签未切换：${error.message}`);}return;}
        if(!/^https:\/\/[\w.-]+\.feishu\.cn\/(base|wiki)\//i.test(entry.url)){toast('打开失败：视图链接无效');return;}
        entry.open=true;activeBindingId=entry.id;showBoundNote();renderNotebook();document.getElementById('notebook-dialog').classList.remove('open');
      });
      const remove=document.createElement('button');remove.textContent='删除';remove.disabled=entries.length<=1;
      remove.addEventListener('click',()=>deleteBindingFromNotebook(entry.id));
      actions.append(open,remove);row.append(info,actions);list.appendChild(row);
    });

      if(result.warning)notify(result.warning);else notify(isDone?'已写回飞书':'已撤销并写回飞书');
    }catch(error){
      if(activeBindingId===bindingId){nativeSnapshotStale=true;input.checked=previousState;renderNativePage();notify(`写回失败：${error.message}`);await refreshActiveNote();}
      else notify(`写回失败：${error.message}`);
    }finally{
      nativeMutationInFlight.delete(mutationKey);
      document.querySelectorAll('.task[data-record-id]').forEach(taskRow=>{if(taskRow.dataset.recordId===recordId&&taskRow.dataset.bindingId===bindingId){const checkbox=taskRow.querySelector('.check');if(checkbox)checkbox.disabled=nativeSnapshotStale;}});
    }
  }
  function completeTask(input) { if(nativeHostAvailable){setNativeCompletion(input,true);return;}if(!input.checked) return; const row=input.closest('.task'); input.disabled=true; setTimeout(()=>{ row.classList.add('done'); input.disabled=false; input.onchange=()=>undoTask(input); const target=document.querySelector('#completed-list .task-list'); target.appendChild(row); document.getElementById('completed-list').open=true; updateProgress(); notify('已写回飞书'); },260); }
  function undoTask(input) { if(nativeHostAvailable){setNativeCompletion(input,false);return;}if(input.checked) return; const row=input.closest('.task'); input.disabled=true; setTimeout(()=>{ row.classList.remove('done'); input.disabled=false; input.onchange=()=>completeTask(input); document.getElementById('active-list').appendChild(row); updateProgress(); notify('已撤销并写回飞书'); },260); }
  function updateProgress() { const done=document.querySelectorAll('.task.done').length; const total=document.querySelectorAll('.task').length; document.getElementById('progress-label').textContent=`${done} / ${total} 完成`; document.getElementById('progress-bar').style.width=`${total?done/total*100:0}%`; document.getElementById('done-count').textContent=`${done} 项`; }
  function toast(message) { notify(message); }
</script>
</body>
</html>
