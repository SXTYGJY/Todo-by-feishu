  .priority { flex:0 0 auto; color:#6e8171; font-size:10px; padding-top:2px; }
  .priority.high { color:#9d705e; }
  .completed { position:relative; margin:7px 16px 0; border-top:1px solid var(--line); flex:0 0 auto; min-height:0; }
  /* 展开区按内容撑开，超出与待完成区相同的高度上限后由列表自身滚动。 */
  .completed[open] { display:flex; flex:0 0 auto; flex-direction:column; min-height:0; overflow:visible; }
  .completed summary { padding:12px 1px; list-style:none; display:flex; align-items:center; justify-content:space-between; color:#807868; font-size:11px; cursor:pointer; }
  .completed[open] summary { flex:0 0 auto; }

  .completed[open] summary:before { content:"▾"; }
  .summary-left { margin-right:auto; }
  .count { color:#a49a84; }
  .completed .task-list { padding:0 0 5px; }

  .completed[open] .task-list::-webkit-scrollbar { display:none; width:0; }
  .completed-scroll-track { display:none; position:absolute; z-index:2; top:39px; right:-15px; bottom:7px; width:8px; border-radius:8px; background:#e8e1cc; touch-action:none; cursor:pointer; }
  .completed.has-overflow .completed-scroll-track { display:block; }
  .completed-scroll-thumb { position:absolute; top:0; left:1px; width:6px; min-height:22px; border-radius:6px; background:#928d78; cursor:grab; }
  .completed-scroll-thumb:active { cursor:grabbing; }
  .completed .task { padding:8px 1px; }
  .foot { padding:10px 18px 14px; display:flex; justify-content:space-between; align-items:center; color:#76918a; font-size:10px; flex:0 0 auto; }
  .link { border:0; padding:0; color:#647b68; background:none; font:inherit; cursor:pointer; }
  .toast { position:absolute; bottom:24px; right:25px; padding:9px 13px; border-radius:9px; color:#fff; background:#37342e; box-shadow:0 4px 18px #0003; opacity:0; transform:translateY(7px); transition:.2s; font-size:12px; pointer-events:none; }
  .toast.show { opacity:1; transform:translateY(0); }
  @media(max-width:700px) { .note { left:16px; top:65px; width:min(310px,calc(100% - 32px)); } }

  async function commitInlineTaskEdit(state){

  async function sendPendingCompletion(bindingId,recordId){

      while(queue.confirmed!==queue.desired&&navigator.onLine&&activeAccountKey===queue.accountKey){

          if(result.warning)notify(result.warning);

            queue.blocked=true;

            networkUnavailable=true;

            notify('离线状态已保留；请切回对应飞书账号后重试。');
            return;

                queue.running=false;

                if(activeAccountKey===queue.accountKey&&activeBindingId===bindingId)applyNativeSnapshot(refreshed.snapshot);
                if(refreshed.snapshot.stale){networkUnavailable=true;updateNetworkIndicator();}
                else if(nativeCompletionQueues.get(mutationKey)?.blocked)notify('一条待写回状态对应的任务已不在当前视图，操作仍保留在本机。请检查飞书视图或删除该便签。');
              }
            }catch{
              networkUnavailable=true;updateNetworkIndicator();
            }

          }

            return;

      updateNetworkIndicator();

    }
  }

    const mutationKey=completionQueueKey(activeAccountKey,bindingId,recordId);
    if(deletingTaskKeys.has(mutationKey)){input.checked=!isDone;return;}
    const item=nativeTodoItems.find(todo=>todo.id===recordId);
    if(!item)return;
    if(isDone&&nativeHostAvailable)nativeRequest('focus.completeTask',{bindingId,taskId:recordId}).catch(()=>{});
    let queue=nativeCompletionQueues.get(mutationKey);
    if(!queue){queue={accountKey:activeAccountKey,bindingId,recordId,confirmed:Boolean(item.isDone),desired:Boolean(isDone),running:false,snapshot:null};nativeCompletionQueues.set(mutationKey,queue);}
    queue.desired=Boolean(isDone);
    nativeTodoItems=nativeTodoItems.map(todo=>todo.id===recordId?{...todo,isDone:queue.desired}:todo);
    persistPendingCompletions();renderNativePage();
    if(!navigator.onLine||nativeSnapshotStale){networkUnavailable=true;updateNetworkIndicator();if(navigator.onLine)refreshActiveNote();return;}
    sendPendingCompletion(bindingId,recordId);
  }
  function completeTask(input) { if(nativeHostAvailable){setNativeCompletion(input,true);return;}if(!input.checked) return;const row=input.closest('.task');row.classList.add('done');input.onchange=()=>undoTask(input);document.querySelector('#completed-list .task-list').appendChild(row);document.getElementById('completed-list').open=true;updateProgress(); }
  function undoTask(input) { if(nativeHostAvailable){setNativeCompletion(input,false);return;}if(input.checked) return;const row=input.closest('.task');row.classList.remove('done');input.onchange=()=>completeTask(input);document.getElementById('active-list').appendChild(row);updateProgress(); }
  function updateProgress() { const done=document.querySelectorAll('.task.done').length; const total=document.querySelectorAll('.task').length; document.getElementById('progress-label').textContent=`${done} / ${total} 完成`; document.getElementById('progress-bar').style.width=`${total?done/total*100:0}%`; document.getElementById('done-count').textContent=`${done} 项`; }
  function toast(message) { notify(message); }
</script>
